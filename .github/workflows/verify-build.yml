name: Verify recorder and build Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium --no-shell
      - if: runner.os != 'Linux'
        run: python -m playwright install chromium --no-shell
      - run: python scripts/run_tests.py --require-browser
      - run: python recorder.py --self-test
      - run: python scripts/smoke_app.py
  windows-portable:
    name: Build and smoke-test Windows x64 executable
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Therein-Windows-x64
          path: |
            dist/Therein-Windows-x64.zip
            dist/Therein-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
